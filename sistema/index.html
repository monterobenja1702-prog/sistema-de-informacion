<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema del Bar - JS </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍹 Barra Central del Bar</h1>
        <button id="btn-lista">📋 Ver lista de tragos</button>
    </header>

    <main>
        <section class="panel-control">
            <h2>Gestión de Pedidos</h2>
            <button id="btn-fernet">🍹 Preparar Fernet</button>
            <button id="btn-gin">🍸 Preparar Gin Tonic</button>
            <button id="btn-vino">🍷 Preparar Vino Tinto</button>
            <button id="btn-mojito">🍃 Preparar Mojito</button>
        </section>

        <section class="barra">
            <h2>Pedidos en la Barra </h2>
            <div id="barra-tragos">
                <p id="obsoleto">🍷 
                    Copa vacía junta polvo</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
